<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Duo 补货监控</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e5e5ea; --ok: #1a8f3c; --ok-bg: #e3f6e8; --no: #8e8e93; --no-bg: #f2f2f7;
    --warn: #b25000; --warn-bg: #fff1e0; --accent: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d;
      --line: #2c2c2e; --ok: #30d158; --ok-bg: #0f3a1c; --no: #8e8e93; --no-bg: #2c2c2e;
      --warn: #ff9f0a; --warn-bg: #3a2600; --accent: #0a84ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .meta { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-top: 16px; }
  .banner { display: none; padding: 12px 16px; border-radius: 12px; margin-top: 16px; font-weight: 600; }
  .banner.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  .banner.err { display: block; background: var(--warn-bg); color: var(--warn); font-weight: 500; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .pill.no { background: var(--no-bg); color: var(--no); }
  .pill.wait { background: var(--warn-bg); color: var(--warn); }
  .events li { padding: 6px 0; border-bottom: 1px solid var(--line); list-style: none; }
  .events { margin: 0; padding: 0; }
  .empty { color: var(--muted); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .setting { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 0; }
  .setting + .setting { border-top: 1px solid var(--line); }
  .label { color: var(--muted); font-size: 13px; min-width: 64px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { background: var(--no-bg); color: var(--text); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  select { font: inherit; font-size: 14px; padding: 4px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .hint { font-size: 13px; color: var(--warn); }
  .saved { font-size: 13px; color: var(--ok); }
</style>
</head>
<body>
<main>
  <header>
    <h1>iPhone Duo 补货监控</h1>
    <span class="meta" id="meta">连接中…</span>
  </header>
  <div class="banner" id="banner"></div>

  <section class="card">
    <h2>查询设置</h2>
    <div class="setting">
      <span class="label">查询间隔</span>
      <div class="seg" id="interval-seg">
        <button data-sec="30">30 秒</button>
        <button data-sec="60">1 分钟</button>
        <button data-sec="90">1.5 分钟</button>
        <button data-sec="120">2 分钟</button>
        <button data-sec="180">3 分钟（推荐）</button>
        <button data-sec="300">5 分钟</button>
        <button data-sec="600">10 分钟</button>
      </div>
      <span class="hint" id="interval-hint"></span>
    </div>
    <div class="setting">
      <span class="label">监控时段</span>
      <label><input type="checkbox" id="allday"> 全天</label>
      <span id="hours-range"><select id="start"></select> 到 <select id="end"></select></span>
      <button id="save-hours">保存时段</button>
    </div>
    <div id="settings-msg" class="meta"></div>
  </section>

  <section class="card">
    <h2>门店取货</h2>
    <div class="scroll"><table id="grid"></table></div>
  </section>

  <section class="card">
    <h2>动态 <button id="notify-btn" hidden>开启浏览器提醒</button></h2>
    <ul class="events" id="events"></ul>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (t) => t ? new Date(t * 1000).toLocaleTimeString() : "—";
let seenEvent = null;
let settings = null;     // last settings the server confirmed
let hoursDirty = false;  // user is editing the time inputs; don't overwrite them

if ("Notification" in window && Notification.permission === "default") {
  $("notify-btn").hidden = false;
  $("notify-btn").onclick = () => Notification.requestPermission().then(() => $("notify-btn").hidden = true);
}

function beep() {
  try {
    const ctx = new AudioContext(), o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.2;
    o.start(); o.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}

async function saveSettings(change) {
  const body = { ...settings, ...change };
  const msg = $("settings-msg");
  msg.className = "meta"; msg.textContent = "保存中…";
  try {
    const r = await fetch("/api/settings", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    hoursDirty = false;
    render(data);
    msg.className = "saved"; msg.textContent = "✓ 已保存，并写入 config.toml";
  } catch (e) {
    msg.className = "hint"; msg.textContent = "保存失败：" + e.message;
  }
}

document.querySelectorAll("#interval-seg button").forEach((b) => {
  b.onclick = () => saveSettings({ interval_seconds: Number(b.dataset.sec) });
});
$("allday").onchange = () => { hoursDirty = true; $("hours-range").style.opacity = $("allday").checked ? 0.4 : 1; };
$("start").onchange = $("end").onchange = () => { hoursDirty = true; };
$("save-hours").onclick = () => {
  if ($("allday").checked) return saveSettings({ active_hours: null });
  const start = $("start").value, end = $("end").value;
  if (start === end) { $("settings-msg").className = "hint"; $("settings-msg").textContent = "开始和结束时间不能一样"; return; }
  saveSettings({ active_hours: [start, end] });
};

// Plain 24-hour dropdowns: a time input shows AM/PM on many Macs, which made
// picking an afternoon end time awkward.
function hourLabel(value) {
  const [h, m] = value.split(":").map(Number);
  if (h === 24 || (h === 0 && m === 0)) return `${h === 24 ? "午夜 12 点" : "凌晨 0 点"} (${value})`;
  const part = h < 6 ? "凌晨" : h < 12 ? "上午" : h === 12 ? "中午" : h < 18 ? "下午" : "晚上";
  const h12 = h > 12 ? h - 12 : h;
  return `${part} ${h12}${m ? ":" + String(m).padStart(2, "0") : " 点"} (${value})`;
}
function fillHours(select, from, to, current) {
  const values = [];
  for (let h = from; h <= to; h++) values.push(`${String(h).padStart(2, "0")}:00`);
  if (current && !values.includes(current)) values.push(current), values.sort();
  select.innerHTML = values.map((v) => `<option value="${v}">${hourLabel(v)}</option>`).join("");
  select.value = current;
}

function renderSettings(cfg) {
  settings = cfg;
  document.querySelectorAll("#interval-seg button").forEach((b) => {
    b.classList.toggle("on", Number(b.dataset.sec) === cfg.interval_seconds);
  });
  const perHour = Math.floor(3600 / cfg.interval_seconds);
  const preset = [30, 60, 90, 120, 180, 300, 600].includes(cfg.interval_seconds);
  $("interval-hint").textContent =
    (preset ? "" : `当前：${cfg.interval_seconds} 秒。`) +
    (cfg.interval_seconds < 150
      ? `每小时约 ${perHour} 次，Apple 大约每小时只放行 30 次，约 ${Math.round(30 * cfg.interval_seconds / 60)} 分钟后会被拦 15~30 分钟`
      : "");
  if (!hoursDirty) {
    const hours = cfg.active_hours;
    $("allday").checked = !hours;
    $("hours-range").style.opacity = hours ? 1 : 0.4;
    fillHours($("start"), 0, 23, hours ? hours[0] : "05:00");
    fillHours($("end"), 1, 24, hours ? hours[1] : "24:00");
  }
}

function render(s) {
  if (s.settings) renderSettings(s.settings);
  const next = s.next_check ? `，下次 ${fmt(s.next_check)}` : "";
  $("meta").textContent = `${s.region.toUpperCase()} · ${s.location} · 已检查 ${s.checks} 次 · 上次 ${fmt(s.last_check)}${next}`;

  const available = s.pickup.filter((p) => p.available);
  const banner = $("banner");
  if (s.sleeping_until) { banner.className = "banner err"; banner.textContent = `🌙 休息中，每天 ${s.active_hours} 监控，${fmt(s.sleeping_until)} 自动开始`; }
  else if (s.last_error) { banner.className = "banner err"; banner.textContent = "⚠️ " + s.last_error; }
  else if (available.length) { banner.className = "banner ok"; banner.textContent = `✅ 现在有 ${available.length} 处可取货！`; }
  else { banner.className = "banner"; }

  // Store x product grid
  const stores = [...new Map(s.pickup.map((p) => [p.store_number, p])).values()];
  if (!stores.length) {
    $("grid").innerHTML = `<tr><td class="empty">${s.checks ? "附近没有门店数据" : "等待第一次检查…"}</td></tr>`;
  } else {
    const head = "<tr><th>门店</th>" + s.products.map((p) => `<th>${esc(p.name)}</th>`).join("") + "</tr>";
    const rows = stores.map((st) => {
      const cells = s.products.map((prod) => {
        const a = s.pickup.find((p) => p.store_number === st.store_number && p.part === prod.part);
        if (!a) return "<td class='empty'>—</td>";
        const cls = {available: "ok", not_open: "wait"}[a.status] || "no";
        const fallback = {available: "有货", not_open: "尚未开放取货"}[a.status] || "无货";
        return `<td><span class="pill ${cls}">${esc(a.quote || fallback)}</span></td>`;
      }).join("");
      return `<tr><td>${esc(st.store_name)}<div class="meta">${esc(st.city)} ${esc(st.distance)}</div></td>${cells}</tr>`;
    }).join("");
    $("grid").innerHTML = head + rows;
  }

  $("events").innerHTML = s.events.length
    ? s.events.slice(0, 50).map((e) => {
        const icon = {in_stock: "✅", still_in_stock: "🔔", sold_out: "❌"}[e.kind] || "•";
        const where = e.store ? ` @ ${esc(e.store)}` : "";
        return `<li>${icon} <b>${esc(e.name)}</b>${where} ${esc(e.quote)} <span class="meta">${fmt(e.time)}</span></li>`;
      }).join("")
    : `<li class="empty">还没有补货动态</li>`;

  const latest = s.events[0];
  if (latest && seenEvent !== null && latest.time !== seenEvent && latest.kind !== "sold_out") {
    beep();
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("iPhone Duo 补货", { body: `${latest.name} ${latest.store || ""} ${latest.quote}` });
    }
  }
  seenEvent = latest ? latest.time : 0;
}

async function tick() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    $("meta").textContent = "无法连接监控进程";
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
