# iPhone Duo 补货监控配置
# 复制为 config.toml 后修改：cp config.example.toml config.toml

[apple]
# 地区: us / cn / hk / hk-zh / tw / jp / sg / ca / uk / au
region = "us"
# 按位置搜索附近门店：美国填邮编；中国大陆填 "省 市 区"，例如 "上海 上海 黄浦区"
location = "10001"
# 或者只查一家门店（例如 R095）；填了 store 就不再按 location 搜附近门店
store = ""
# 只关心这些门店（留空 = 接口返回的所有附近门店）
store_filter = []

# 想监控的型号，可以写多个。
# capacity: 256gb / 512gb / 1tb / 2tb；color: nightsky（Night Sky）/ starwhite（Star White）
# 程序内置了各地区的型号号码，运行 `python3 -m duo_restock models` 可以查看。
# 如果 Apple 出了新颜色、内置表里没有，也可以直接写 part = "MXXXXLL/A"。
[[products]]
capacity = "512gb"
color = "nightsky"

[[products]]
capacity = "512gb"
color = "starwhite"

[monitor]
# 检查间隔（秒）。每次检查只发一个请求（所有型号一起查）。
# 实测 Apple 每个 IP 每小时大约只放行 30 次查询，超过就会拦截 15~30 分钟。
# 60 秒和 120 秒都会在第 30 次左右被拦；180 秒（每小时 20 次）留有余量，不会断
interval_seconds = 180
# 每次在间隔上随机加 0~N 秒，避免请求过于规律
jitter_seconds = 15
# 被拦截后依次冷却 5 / 10 / 20 / 30 分钟再试，这里是冷却时间的上限
max_backoff_seconds = 1800
# 每天只在这个时间段内监控（按电脑本地时间），其余时间程序挂着不发请求。
# 门店补货多在早上开门前放出；注释掉这一行就是全天监控。
active_hours = ["05:00", "10:00"]
# 有货 → 无货时也推送
notify_sold_out = false
# 持续有货时每隔多少分钟再提醒一次（0 = 只在刚补货时提醒一次）
remind_minutes = 0
state_file = "state.json"

[dashboard]
# 本地网页看板，运行后打开 http://127.0.0.1:8765
# 想用手机在同一 Wi-Fi 下查看就改成 "0.0.0.0"
host = "127.0.0.1"
port = 8765

# ---- 通知渠道：去掉想用的渠道前面的 #，填好参数即可，可以同时开多个 ----

[notify.desktop]
# 电脑本机弹窗 + 提示音（macOS / Linux / Windows）
enabled = true
say = false          # macOS 上同时语音播报

